services:
  server:
    build:
      context: ./backend/
    container_name: multi-tenant-saas-api-server
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
  

  db:
    image: postgres:16-alpine
    container_name: multi-tenant-saas-api-db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [pg_isready -U postgres -d multi-tenant-saas-api-postgres]
      interval: 10s
      timeout: 5s
      retries: 5
    
  redis:
    image: redis:7-alpine
    container_name: multi-tenant-saas-api-redis
    restart: unless-stopped
    ports:
      - 6379:6379
    
  pgadmin:
    profiles:
      - admin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
    db:
      condition: service_healthy

volumes:
  postgres_data